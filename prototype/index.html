<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9eee5"><title>ZAID — Visual Storyteller</title>
<link rel="preconnect" href="https://images.unsplash.com"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="prototype.css">
</head>
<body>
<div class="progress" id="progress"></div>
<main>
<section class="hero" aria-label="Cinematic opening">
<img class="hero-image" src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=2400&q=90" alt="" fetchpriority="high">
<div class="hero-wash"></div><div class="hero-frame"></div>
<div class="hero-mark"></div><div class="hero-index"></div><a class="scroll-cue" href="#worlds" aria-label="Explore"></a>
</section>
<section class="worlds" id="worlds" aria-label="Visual worlds">
<div class="world-grid">
<button class="world world-a" data-target="film-1" aria-label="Documentary visual"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1400&q=88" alt="" loading="lazy"><span class="world-shape"></span></button>
<button class="world world-b" data-target="film-2" aria-label="Brand film visual"><img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1400&q=88" alt="" loading="lazy"><span class="world-shape"></span></button>
<button class="world world-c" data-target="film-3" aria-label="Short form visual"><img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1400&q=88" alt="" loading="lazy"><span class="world-shape"></span></button>
<button class="world world-d" data-target="film-4" aria-label="Visual experiments"><img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1400&q=88" alt="" loading="lazy"><span class="world-shape"></span></button>
</div>
</section>
<section class="film-reel" aria-label="Selected visual frames">
<div class="reel-track">
<figure class="film-frame frame-wide" id="film-1"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2000&q=90" alt="" loading="lazy"></figure>
<figure class="film-frame frame-tall" id="film-2"><img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?auto=format&fit=crop&w=1200&q=90" alt="" loading="lazy"></figure>
<figure class="film-frame frame-wide" id="film-3"><img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=2000&q=90" alt="" loading="lazy"></figure>
<figure class="film-frame frame-wide" id="film-4"><img src="https://images.unsplash.com/photo-1497250681960-ef046c08a56e?auto=format&fit=crop&w=2000&q=90" alt="" loading="lazy"></figure>
</div>
</section>
<section class="closing" aria-label="Closing frame"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=2400&q=90" alt="" loading="lazy"><div class="closing-light"></div><div class="closing-ring"></div></section>
</main>
<script src="prototype.js"></script>
</body></html>
