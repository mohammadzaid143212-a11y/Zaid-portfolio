name: Portfolio smoke checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/portfolio-completion-phase]
permissions:
  contents: read
jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run portfolio smoke checks
        run: node scripts/smoke-check.mjs
